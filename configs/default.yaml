# Default configuration for Adaptive OTA-FL experiments

noise:
  alpha: 1.5  # Tail index for α-stable noise (1 < alpha <= 2)
  noise_scale: 0.1  # Scale parameter for interference
  fading_variance: 0.1  # Channel fading variance
  use_clipping: true  # Enable Median Anchored Clipping
  clip_threshold: null  # null for automatic threshold

optimizer:
  name: "adamota"  # "adagradota" or "adamota"
  lr: 0.001  # Learning rate
  alpha: 1.5  # α-norm parameter (should match noise alpha)
  betas: [0.9, 0.999]  # For Adam-OTA
  eps: 1e-8
  weight_decay: 0.0
  amsgrad: false

model:
  name: "mlp"  # "mlp", "cnn", "resnet18", "resnet34"
  num_classes: 10

data:
  name: "mnist"  # "mnist" or "cifar10"
  batch_size: 64
  num_clients: 100
  data_split: "iid"  # "iid" or "non-iid"
  non_iid_alpha: 0.5  # For non-IID split

training:
  num_rounds: 100
  local_epochs: 1
  device: "cuda"  # "cuda" or "cpu"
  seed: 42
  save_dir: "results"
  log_interval: 10
